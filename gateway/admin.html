<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>TokenRouter 管理后台</title>
  <style nonce="__NONCE__">
    :root{color-scheme:light;--ink:#12211b;--muted:#68756e;--line:#dde6e1;--green:#0b8f61;--green2:#e9f8f1;--danger:#c33636;--bg:#f4f7f5;--card:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}button,input,select{font:inherit}
    header{height:64px;background:#102c22;color:#fff;display:flex;align-items:center;padding:0 max(20px,calc((100vw - 1200px)/2));gap:12px}header b{font-size:19px}header span{opacity:.66}.spacer{flex:1}
    main{max-width:1440px;margin:24px auto;padding:0 20px}.grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:12px}.grid>*{min-width:0}.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 5px 20px #143b2810}
    h2{font-size:17px;margin:0 0 16px}.field{margin:13px 0}.field label{display:block;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;height:42px;border:1px solid #cbd8d1;border-radius:9px;padding:0 11px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #0b8f6118}
    .mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button{height:42px;border:1px solid var(--line);border-radius:9px;background:#fff}.mode button.on{border-color:var(--green);color:var(--green);background:var(--green2);font-weight:650}
    .primary,.plain,.danger{border:0;border-radius:9px;height:40px;padding:0 16px;cursor:pointer}.primary{width:100%;background:var(--green);color:#fff;font-weight:650}.plain{background:#edf2ef;color:var(--ink)}.danger{background:#fff0f0;color:var(--danger)}button:disabled{opacity:.48;cursor:not-allowed}
    .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:24px;margin-top:4px}
    .toolbar{display:flex;gap:8px;margin-bottom:14px}.toolbar input{flex:1;min-width:120px}.toolbar input,.toolbar select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff}
    .table-wrap{max-width:100%;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #edf1ef}th{color:var(--muted);font-weight:550}.tag{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#edf2ef}.tag.active{color:#08764f;background:#e6f7ef}.tag.exhausted{color:#a76000;background:#fff4df}.tag.revoked,.tag.expired{color:#9a3434;background:#ffeded}progress{display:block;width:100px;height:6px;border:0;margin-top:4px;accent-color:var(--green)}
    .pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:14px;color:var(--muted)}
    .overlay{position:fixed;inset:0;background:#102c22;display:grid;place-items:center;padding:20px;z-index:10}.login{width:min(390px,100%);background:#fff;border-radius:16px;padding:26px}.login h1{margin:0 0 6px;font-size:22px}.login p{color:var(--muted);margin:0 0 20px}.login input{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 11px;margin-bottom:12px}.hidden{display:none!important}
    .result{position:fixed;inset:0;background:#102c22aa;display:grid;place-items:center;padding:20px;z-index:9}.result-box{background:#fff;border-radius:15px;width:min(760px,100%);max-height:80vh;padding:22px;overflow:auto}.keys{width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;padding:10px;font:12px/1.7 ui-monospace,monospace;resize:vertical}.note{font-size:12px;color:#9a5d00;background:#fff7e6;padding:9px;border-radius:8px;margin:10px 0}
    @media(max-width:800px){header{padding:0 15px}header span{display:none}main{padding:0 12px;margin:14px auto}.grid{grid-template-columns:minmax(0,1fr)}.metrics{grid-template-columns:1fr 1fr}.toolbar{flex-wrap:wrap}.toolbar input{width:100%;flex-basis:100%}.toolbar select{min-width:0;max-width:100%}.panel{padding:15px}.metric strong{font-size:20px}}
  </style>
</head>
<body>
  <header><b>AK TokenRouter</b><span>临时 Key 与额度管理</span><div class="spacer"></div><small id="viewer"></small><button id="logout" class="plain">退出</button></header>
  <main id="app" class="hidden">
    <section class="metrics"><div class="metric"><small>卡片总数</small><strong id="mTotal">—</strong></div><div class="metric"><small>使用中</small><strong id="mActive">—</strong></div><div class="metric"><small>已耗尽</small><strong id="mDone">—</strong></div><div class="metric"><small>累计 Tokens</small><strong id="mTokens">—</strong></div></section>
    <div class="grid">
      <section id="cardIssuer" class="panel"><h2>生成临时 Key</h2><div class="field"><label>商户 / 路由器编号</label><input id="routerId" value="MERCHANT-" maxlength="128"></div>
        <div class="field"><label>额度类型</label><div class="mode"><button id="tokenMode" class="on">按 Tokens</button><button id="creditMode">按金额</button></div></div>
        <div class="field"><label id="quotaLabel">Tokens 额度</label><input id="quota" type="number" min="1" value="1000000"></div>
        <div class="field"><label>生成数量（1～100）</label><input id="count" type="number" min="1" max="100" value="1"></div>
        <div class="field"><label>有效期</label><select id="ttl"><option value="24">24 小时</option><option value="72">3 天</option><option value="168" selected>7 天</option><option value="720">30 天</option><option value="8760">1 年</option></select></div>
        <button id="create" class="primary">生成临时 Key</button></section>
      <section class="panel"><h2>卡片列表</h2><div class="toolbar"><input id="search" placeholder="搜索商户编号或 Key 前缀"><select id="status"><option value="all">全部状态</option><option value="active">使用中</option><option value="exhausted">已耗尽</option><option value="expired">已过期</option><option value="revoked">已撤销</option></select><select id="type"><option value="all">全部类型</option><option value="tokens">Tokens</option><option value="credit">金额</option></select><button id="refresh" class="plain">查询</button></div>
        <div class="table-wrap"><table><thead><tr><th>ID / Key</th><th>商户编号</th><th>额度与用量</th><th>状态</th><th>请求</th><th>到期时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><span id="pageInfo"></span><button id="prev" class="plain">上一页</button><button id="next" class="plain">下一页</button></div></section>
    </div>
    <section id="platformAdmin" class="panel hidden" style="margin-top:12px"><h2>商户账号</h2><div class="grid"><div><div class="field"><label>商户编号</label><input id="merchantCode" placeholder="MERCHANT-001"></div><div class="field"><label>商户名称</label><input id="merchantName" placeholder="示例咖啡店"></div><div class="field"><label>登录用户名</label><input id="merchantUser" placeholder="merchant_001"></div><div class="field"><label>初始密码（至少 12 位）</label><input id="merchantPassword" type="password" autocomplete="new-password"></div><button id="createMerchant" class="primary">创建商户账号</button><p id="merchantResult"></p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h2>分配路由器</h2><div class="field"><label>路由器编号</label><input id="assignRouter" placeholder="ROUTER-001"></div><div class="field"><label>归属商户编号</label><input id="assignMerchant" placeholder="MERCHANT-001"></div><button id="assignRouterButton" class="plain">保存路由器归属</button><p id="assignResult"></p></div><div class="table-wrap"><table><thead><tr><th>用户名</th><th>角色</th><th>所属商户</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="userRows"></tbody></table></div></div></section>
  </main>
  <div id="loginLayer" class="overlay"><form id="loginForm" class="login"><h1>设备服务管理登录</h1><p>请输入平台账号和密码</p><input id="username" autocomplete="username" placeholder="用户名" required><input id="password" type="password" autocomplete="current-password" placeholder="密码" required><button class="primary">登录</button><p id="loginError"></p></form></div>
  <div id="resultLayer" class="result hidden"><div class="result-box"><h2>临时 Key 已生成</h2><div class="note">明文只显示这一次，请立即复制或下载保存。数据库无法还原。</div><textarea id="keys" class="keys" readonly></textarea><div class="toolbar"><button id="copyKeys" class="primary">复制全部</button><button id="downloadKeys" class="plain">下载 CSV</button><button id="closeResult" class="plain">关闭</button></div></div></div>
  <script nonce="__NONCE__">
    const $=id=>document.getElementById(id),api='./v1/admin';let mode='tokens',page=1,total=0,lastCards=[],viewer={role:''};
    const fmt=n=>Number(n||0).toLocaleString('zh-CN'),date=v=>v?new Date(v).toLocaleString('zh-CN'):'—';
    async function request(path,opt={}){const r=await fetch(api+path,{headers:{'content-type':'application/json',...(opt.headers||{})},...opt});let b={};try{b=await r.json()}catch{}if(r.status===401){showLogin();throw Error('请重新登录')}if(!r.ok)throw Error(b.error||'请求失败');return b}
    function showLogin(){$('loginLayer').classList.remove('hidden');$('app').classList.add('hidden')}
    function showApp(){$('loginLayer').classList.add('hidden');$('app').classList.remove('hidden')}
    function setMode(next){mode=next;$('tokenMode').classList.toggle('on',next==='tokens');$('creditMode').classList.toggle('on',next==='credit');$('quotaLabel').textContent=next==='tokens'?'Tokens 额度':'人民币额度（元）';$('quota').value=next==='tokens'?'1000000':'2'}
    async function load(){const q=new URLSearchParams({page,page_size:20,query:$('search').value,status:$('status').value,quota_type:$('type').value});const [s,d]=await Promise.all([request('/summary'),request('/cards?'+q)]);viewer=s.viewer||viewer;showApp();$('viewer').textContent=`${viewer.username||''} · ${viewer.role==='admin'?'平台管理员':'商户'}`;$('cardIssuer').classList.toggle('hidden',viewer.role!=='admin');$('platformAdmin').classList.toggle('hidden',viewer.role!=='admin');$('mTotal').textContent=fmt(s.total_cards);$('mActive').textContent=fmt(s.active_cards);$('mDone').textContent=fmt(s.exhausted_cards);$('mTokens').textContent=fmt(s.used_tokens);total=d.total;render(d.cards);if(viewer.role==='admin')await loadUsers()}
    async function loadUsers(){const d=await request('/users');$('userRows').innerHTML=d.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${u.role==='admin'?'管理员':'商户'}</td><td>${esc(u.merchant_name||u.merchant_code||'—')}</td><td>${u.status==='active'?'正常':'已停用'}</td><td>${date(u.created_at)}</td></tr>`).join('')||'<tr><td colspan="5">暂无账号</td></tr>'}
    function render(cards){const labels={active:'使用中',exhausted:'已耗尽',expired:'已过期',revoked:'已撤销'};$('rows').innerHTML=cards.map(c=>{const limit=c.quota_type==='tokens'?Number(c.token_limit):Number(c.credit_limit_microunit),used=c.quota_type==='tokens'?Number(c.used_tokens):Number(c.used_credit_microunit),pct=Math.min(100,limit?used/limit*100:0),show=c.quota_type==='tokens'?`${fmt(used)} / ${fmt(limit)} T`:`¥${(used/1e6).toFixed(4)} / ¥${(limit/1e6).toFixed(2)}`;const act=viewer.role==='admin'&&c.status==='active'?`<button class="danger revoke" data-id="${c.id}">撤销</button>`:'—';return `<tr><td>#${c.id}<br><small>${c.key_prefix}…</small></td><td>${esc(c.router_id)}</td><td>${show}<progress max="100" value="${pct}"></progress></td><td><span class="tag ${c.status}">${labels[c.status]||c.status}</span></td><td>${fmt(c.request_count)}</td><td>${date(c.expires_at)}</td><td>${act}</td></tr>`}).join('')||'<tr><td colspan="7">暂无数据</td></tr>';document.querySelectorAll('.revoke').forEach(b=>b.onclick=()=>revoke(b.dataset.id));$('pageInfo').textContent=`第 ${page} 页 · 共 ${fmt(total)} 条`;$('prev').disabled=page<=1;$('next').disabled=page*20>=total}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function revoke(id){if(!confirm('确定撤销这张卡？撤销后立即无法调用。'))return;await request(`/cards/${id}/revoke`,{method:'POST',body:'{}'});await load()}
    $('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';try{await request('/login',{method:'POST',body:JSON.stringify({username:$('username').value.trim(),password:$('password').value})});$('password').value='';await load()}catch(err){$('loginError').textContent=err.message}}
    $('createMerchant').onclick=async()=>{try{const body={merchant_code:$('merchantCode').value.trim(),merchant_name:$('merchantName').value.trim(),username:$('merchantUser').value.trim(),password:$('merchantPassword').value};await request('/merchants',{method:'POST',body:JSON.stringify(body)});$('merchantPassword').value='';$('merchantResult').textContent='商户账号已创建';await loadUsers()}catch(err){$('merchantResult').textContent=err.message}}
    $('assignRouterButton').onclick=async()=>{try{const id=$('assignRouter').value.trim(),merchant_code=$('assignMerchant').value.trim();await request(`/routers/${encodeURIComponent(id)}/merchant`,{method:'POST',body:JSON.stringify({merchant_code})});$('assignResult').textContent='路由器归属已保存'}catch(err){$('assignResult').textContent=err.message}}
    $('create').onclick=async()=>{try{const quota=Number($('quota').value),body={router_id:$('routerId').value.trim(),quota_type:mode,count:Number($('count').value),ttl_hours:Number($('ttl').value)};if(mode==='tokens')body.token_limit=quota;else body.credit_limit_microunit=Math.round(quota*1e6);const d=await request('/cards',{method:'POST',body:JSON.stringify(body)});lastCards=d.cards;$('keys').value=d.cards.map((c,i)=>`${i+1}\t${c.api_key}\t${c.quota_type==='tokens'?c.token_limit+' Tokens':'¥'+(c.credit_limit_microunit/1e6).toFixed(2)}\t${c.expires_at}`).join('\n');$('resultLayer').classList.remove('hidden');await load()}catch(err){alert(err.message)}}
    $('copyKeys').onclick=async()=>{await navigator.clipboard.writeText($('keys').value);$('copyKeys').textContent='已复制';setTimeout(()=>$('copyKeys').textContent='复制全部',1200)};
    $('downloadKeys').onclick=()=>{const rows=['index,api_key,quota_type,token_limit,credit_limit_microunit,expires_at',...lastCards.map((c,i)=>[i+1,c.api_key,c.quota_type,c.token_limit||'',c.credit_limit_microunit||'',c.expires_at].join(','))];const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv'}));a.download='tokenrouter-keys.csv';a.click();URL.revokeObjectURL(a.href)};
    $('closeResult').onclick=()=>$('resultLayer').classList.add('hidden');$('tokenMode').onclick=()=>setMode('tokens');$('creditMode').onclick=()=>setMode('credit');$('refresh').onclick=()=>{page=1;load().catch(()=>{})};$('prev').onclick=()=>{page--;load()};$('next').onclick=()=>{page++;load()};$('logout').onclick=async()=>{await request('/logout',{method:'POST',body:'{}'}).catch(()=>{});showLogin()};load().catch(()=>showLogin());
  </script>
</body></html>
